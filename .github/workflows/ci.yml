name: Python Test Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MyFramework/requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

      - name: Run Pytest (force headless in CI)
        env:
          HEADLESS: "true"
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest MyFramework/tests --maxfail=1 --disable-warnings -q --html=MyFramework/reports/report.html --self-contained-html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: MyFramework/reports/report.html

      - name: Upload failed screenshots
        if: failure()   # only upload if tests failed
        uses: actions/upload-artifact@v4
        with:
          name: failed-screenshots
          path: MyFramework/reports/screenshots/
